name: "my-hadoop"

version: "3"

services:
  namenode:
    # image: bde2020/hadoop-namenode:2./0.0-hadoop3.2.1-java8
    image: hadoop-namenode-python:0.1
    container_name: namenode
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    environment:
      - CLUSTER_NAME=test
    env_file:
      - ./hadoop.env

  datanode:
    # image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    image: hadoop-datanode-python:0.1
    container_name: datanode
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    env_file:
      - ./hadoop.env
  
  hive-metastore-db:
    image: postgres:10
    container_name: hive-metastore-db
    environment:
      - POSTGRES_USER=hive
      - POSTGRES_PASSWORD=hive
      - POSTGRES_DB=metastore_db
    volumes:
      - hive_metastore_data:/var/lib/postgresql/data
  
  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-metastore
    environment:
      - "CORE_CONF_fs_defaultFS=hdfs://namenode:9000"
      - "HIVE_SITE_CONF_javax_jdo_option_ConnectionURL=jdbc:postgresql://hive-metastore-db:5432/metastore_db"
      - "HIVE_SITE_CONF_javax_jdo_option_ConnectionDriverName=org.postgresql.Driver"
      - "HIVE_SITE_CONF_javax_jdo_option_ConnectionUserName=hive"
      - "HIVE_SITE_CONF_javax_jdo_option_ConnectionPassword=hive"
      - "HIVE_SITE_CONF_hive_metastore_schema_verification=false"
      - "HIVE_SITE_CONF_hive_metastore_event_db_notification_api_auth=false"
    command: /opt/hive/bin/hive --service metastore
    depends_on:
      - namenode
      - datanode
      - hive-metastore-db

  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: hive-server
    ports:
      - "10000:10000"
    environment:
      - "CORE_CONF_fs_defaultFS=hdfs://namenode:9000"
      - "HIVE_SITE_CONF_javax_jdo_option_ConnectionURL=jdbc:postgresql://hive-metastore-db:5432/metastore_db"
      - "HIVE_SITE_CONF_javax_jdo_option_ConnectionDriverName=org.postgresql.Driver"
      - "HIVE_SITE_CONF_javax_jdo_option_ConnectionUserName=hive"
      - "HIVE_SITE_CONF_javax_jdo_option_ConnectionPassword=hive"
      - "HIVE_SITE_CONF_hive_metastore_schema_verification=false"
      - "HIVE_SITE_CONF_hive_metastore_event_db_notification_api_auth=false"
    command: /opt/hive/bin/hive --service hiveserver2
    depends_on:
      - hive-metastore

volumes:
  hadoop_namenode:
  hadoop_datanode:
  hive_metastore_data:


